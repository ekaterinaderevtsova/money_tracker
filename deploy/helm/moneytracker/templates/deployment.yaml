apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moneytracker.fullname" . }}
  labels: {{- include "moneytracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "moneytracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "moneytracker.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "moneytracker.fullname" . }}-secret

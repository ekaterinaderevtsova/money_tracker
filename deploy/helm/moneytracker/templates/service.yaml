apiVersion: v1
kind: Service
metadata:
  name: {{ include "moneytracker.fullname" . }}
  labels: {{- include "moneytracker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "moneytracker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
